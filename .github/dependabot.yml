version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # x/text v0.43+ requires Go 1.26; this module still supports Go 1.25.
      - dependency-name: "golang.org/x/text"
        versions: [">= 0.43.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
